<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PIXEL JUMP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Courier New",monospace}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center}
#game-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;border:2px solid #fff;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.88);text-align:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.hidden{display:none}
h1{margin:0 0 12px;font-size:38px}
p{margin:5px 0;color:#bbb;font-size:13px}
button{margin-top:20px;padding:14px 30px;border:0;background:#fff;color:#000;font:700 18px "Courier New",monospace}
button:disabled{background:#555;color:#aaa}
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="game"></canvas>

<div id="start-screen" class="overlay">
<h1>PIXEL JUMP</h1>
<p>PRESS = DIRECTION</p>
<p>HOLD = POWER</p>
<p>RELEASE = JUMP</p>
<button id="start-button" disabled>LOADING...</button>
</div>

<div id="game-over-screen" class="overlay hidden">
<h1>GAME OVER</h1>
<p id="final-score">HEIGHT: 000</p>
<p id="final-time">TIME: 0.00</p>
<p id="best-score">BEST: 000</p>
<p id="continue-note">CONTINUE = PRACTICE / RECORDS DISABLED</p>
<button id="continue-button">CONTINUE</button>
<button id="retry-button">RETRY</button>
</div>
</div>

<script>
(() => {
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const startScreen=document.getElementById("start-screen");
const gameOverScreen=document.getElementById("game-over-screen");
const startButton=document.getElementById("start-button");
const continueButton=document.getElementById("continue-button");
const retryButton=document.getElementById("retry-button");
const finalScore=document.getElementById("final-score");
const finalTime=document.getElementById("final-time");
const bestScore=document.getElementById("best-score");

const W=360,H=640;
canvas.width=W; canvas.height=H;
ctx.imageSmoothingEnabled=false;

const spriteSheet=new Image();
let spriteReady=false;
let activeSprite=spriteSheet;
let usingFallbackSprite=false;

const FRAME_W=16,FRAME_H=16;
const FRAME_IDLE=0,FRAME_STEP=1,FRAME_JUMP=2;

function createFallbackSpriteSheet(){
    // 外部PNGが読めない場合でもゲームを遊べるよう、
    // 48x16 / 3フレームの簡易1bitキャラを自動生成する。
    const c=document.createElement("canvas");
    c.width=48;
    c.height=16;
    const g=c.getContext("2d");
    g.imageSmoothingEnabled=false;
    g.fillStyle="#fff";

    function px(frame,x,y,w=1,h=1){
        g.fillRect(frame*16+x,y,w,h);
    }

    // IDLE
    px(0,6,2,4,3);     // head
    px(0,5,5,6,5);     // body
    px(0,4,6,1,4);     // left arm
    px(0,11,6,1,4);    // right arm
    px(0,6,10,2,4);    // left leg
    px(0,8,10,2,4);    // right leg
    px(0,5,14,3,1);    // left foot
    px(0,8,14,3,1);    // right foot

    // STEP
    px(1,6,2,4,3);
    px(1,5,5,6,5);
    px(1,4,6,1,4);
    px(1,11,6,1,4);
    px(1,5,10,2,3);
    px(1,9,10,2,3);
    px(1,3,13,4,1);
    px(1,9,13,4,1);

    // JUMP
    px(2,6,3,4,3);
    px(2,5,6,6,5);
    px(2,3,3,2,5);     // left arm up
    px(2,11,3,2,5);    // right arm up
    px(2,4,11,3,2);    // left leg out
    px(2,9,11,3,2);    // right leg out
    px(2,3,13,3,1);
    px(2,10,13,3,1);

    return c;
}

function useFallbackSprite(reason){
    activeSprite=createFallbackSpriteSheet();
    usingFallbackSprite=true;
    spriteReady=true;
    startButton.disabled=false;
    startButton.textContent="START";
    console.warn("Using built-in fallback sprite:",reason);
}

spriteSheet.onload=()=>{
    if(spriteSheet.naturalWidth!==48 || spriteSheet.naturalHeight!==16){
        console.error(
            "player_1bit00_sheet.png must be 48x16.",
            spriteSheet.naturalWidth,
            spriteSheet.naturalHeight
        );
        useFallbackSprite("sprite size mismatch");
        return;
    }

    activeSprite=spriteSheet;
    usingFallbackSprite=false;
    spriteReady=true;
    startButton.disabled=false;
    startButton.textContent="START";
};

spriteSheet.onerror=()=>{
    console.error("Could not load ./player_1bit00_sheet.png");
    useFallbackSprite("sprite load error");
};

spriteSheet.src="./player_1bit00_sheet.png";

const CONFIG={
    PLAYER_SIZE:48,
    GRAVITY:980,
    MAX_FALL_SPEED:820,
    MIN_JUMP_VY:410,
    MAX_JUMP_VY:720,
    MAX_VX:250,
    AIM_SPEED:0.72,
    CHARGE_TIME:0.85,
    STEP_FPS:5,
    METER_W:72,
    METER_H:7,
    METER_MARGIN:8,
    POWER_GAP:14,
    PLATFORM_H:8,
    START_MIN_W:128,
    START_MAX_W:168,
    START_MIN_GAP:70,
    START_MAX_GAP:94,
    END_MIN_W:56,
    END_MAX_W:92,
    END_MIN_GAP:100,
    END_MAX_GAP:128,
    START_MIN_X_DIST:18,
    START_MAX_X_DIST:78,
    END_MIN_X_DIST:90,
    END_MAX_X_DIST:190,
    DIFFICULTY_MAX_STEP:50,
    POST_NO_SKIP_END:70,
    POST_MAX_GAP_MAX:154,
    POST_MAX_NO_SKIP_MARGIN:4,
    POST_60_NARROW_START:60,
    POST_60_NARROW_END:90,
    POST_60_MIN_W:46,
    POST_60_MAX_W:76,
    POST_60_MAX_X_DIST:220,
    LAND_MARGIN_X:21,
    LAND_TOLERANCE:5,
    CAMERA_LINE:0.44,
    WALL_BOUNCE:1.0
};

function resize(){
    const scale=Math.min(innerWidth/W,innerHeight/H);
    canvas.style.width=Math.floor(W*scale)+"px";
    canvas.style.height=Math.floor(H*scale)+"px";
    ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize);
resize();

let gameState="title";
let lastTime=0,elapsed=0;
let playTime=0;
let cameraY=0;
let platforms=[];
let nextPlatformY=0,nextStep=0;
let highestStep=0;

function loadBest(){
    try{
        const value=Number(localStorage.getItem("pixelJumpBest")||0);
        return Number.isFinite(value)?value:0;
    }catch(err){
        console.warn("High score storage is unavailable.",err);
        return 0;
    }
}

function saveBest(value){
    try{
        localStorage.setItem("pixelJumpBest",String(value));
    }catch(err){
        console.warn("Could not save high score.",err);
    }
}

let best=loadBest();
let bestBeforeRun=best;
let continueUsed=false;
let checkpoint=null;

let aimPhase=0;
let charging=false;
let charge=0;
let lockedAim=0;
let directionLocked=false;

const player={
    x:0,y:0,vx:0,vy:0,
    w:CONFIG.PLAYER_SIZE,
    h:CONFIG.PLAYER_SIZE,
    grounded:true,
    currentPlatformId:0,
    currentStep:0,
    facing:1
};

const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function difficulty(step){
    const t=clamp(
        step/CONFIG.DIFFICULTY_MAX_STEP,
        0,
        1
    );

    // 序盤は急に締めすぎず、20〜50段にかけてじわじわ難しくする。
    return Math.pow(t,0.90);
}

function getPlatformSettings(step){
    const d=difficulty(step);
    return {
        d,
        minW:lerp(CONFIG.START_MIN_W,CONFIG.END_MIN_W,d),
        maxW:lerp(CONFIG.START_MAX_W,CONFIG.END_MAX_W,d),
        minGap:lerp(CONFIG.START_MIN_GAP,CONFIG.END_MIN_GAP,d),
        maxGap:lerp(CONFIG.START_MAX_GAP,CONFIG.END_MAX_GAP,d),
        minXDist:lerp(CONFIG.START_MIN_X_DIST,CONFIG.END_MIN_X_DIST,d),
        maxXDist:lerp(CONFIG.START_MAX_X_DIST,CONFIG.END_MAX_X_DIST,d)
    };
}

function getChallengeMix(d){
    // 同じ足場で「細い・高い・遠い」が全部MAXにならないようにする。
    // 3要素のローカル難度(0〜1)に合計上限を設け、
    // 段数が上がるほど少しずつ厳しい組み合わせを許可する。
    let widthChallenge=Math.random();
    let gapChallenge=Math.random();
    let xChallenge=Math.random();

    const maxBudget=1.22+0.28*d;
    const minBudget=0.62+0.28*d;
    let sum=widthChallenge+gapChallenge+xChallenge;

    if(sum>maxBudget){
        const scale=maxBudget/sum;
        widthChallenge*=scale;
        gapChallenge*=scale;
        xChallenge*=scale;
        sum=maxBudget;
    }

    if(sum<minBudget && sum>0){
        const scale=minBudget/sum;
        widthChallenge=Math.min(1,widthChallenge*scale);
        gapChallenge=Math.min(1,gapChallenge*scale);
        xChallenge=Math.min(1,xChallenge*scale);
    }

    return {widthChallenge,gapChallenge,xChallenge};
}

function maxHorizontalReachForRise(rise){
    // 最大POWERで指定の高さに達し、下降時に同じ高さへ戻るまでの時間から
    // 水平方向の最大到達距離を求める。
    const vy=CONFIG.MAX_JUMP_VY;
    const g=CONFIG.GRAVITY;
    const disc=vy*vy-2*g*rise;
    if(disc<0) return 0;

    const landingTime=(vy+Math.sqrt(disc))/g;
    return CONFIG.MAX_VX*landingTime;
}

function addPlatform(){
    nextStep++;
    const s=getPlatformSettings(nextStep);

    // 60段以降は足場幅をもう一段だけ締める。
    // 以前より下限を緩め、極端な細さより横距離で難しくする。
    if(nextStep>CONFIG.POST_60_NARROW_START){
        const narrowT=clamp(
            (nextStep-CONFIG.POST_60_NARROW_START)/
            (CONFIG.POST_60_NARROW_END-CONFIG.POST_60_NARROW_START),
            0,
            1
        );

        s.minW=lerp(s.minW,CONFIG.POST_60_MIN_W,narrowT);
        s.maxW=lerp(s.maxW,CONFIG.POST_60_MAX_W,narrowT);
        s.maxXDist=lerp(s.maxXDist,CONFIG.POST_60_MAX_X_DIST,narrowT);
    }

    // 物理上の最高到達高度を超える配置は生成しない。
    const maxRise=(CONFIG.MAX_JUMP_VY*CONFIG.MAX_JUMP_VY)/(2*CONFIG.GRAVITY);

    // 50〜70段では縦Gapを滑らかに伸ばし、70段以降で
    // 連続2足場の合計高低差が最大ジャンプ高度を超える状態にする。
    if(nextStep>CONFIG.DIFFICULTY_MAX_STEP){
        const noSkipMinGap=maxRise/2+CONFIG.POST_MAX_NO_SKIP_MARGIN;
        const postT=clamp(
            (nextStep-CONFIG.DIFFICULTY_MAX_STEP)/
            (CONFIG.POST_NO_SKIP_END-CONFIG.DIFFICULTY_MAX_STEP),
            0,
            1
        );
        s.minGap=lerp(s.minGap,noSkipMinGap,postT);
        s.maxGap=lerp(s.maxGap,CONFIG.POST_MAX_GAP_MAX,postT);
    }

    const mix=getChallengeMix(s.d);

    // widthChallenge=1ほど細い。gap/x は1ほど遠い。
    const width=lerp(s.maxW,s.minW,mix.widthChallenge);
    const requestedGap=lerp(s.minGap,s.maxGap,mix.gapChallenge);
    const gap=Math.min(requestedGap,maxRise*0.92);

    const previous=platforms[platforms.length-1];
    nextPlatformY-=gap;

    const margin=14;
    const minCenter=margin+width/2;
    const maxCenter=W-margin-width/2;

    let center=W/2;

    if(previous){
        const previousCenter=previous.x+previous.w/2;
        let xDist=lerp(s.minXDist,s.maxXDist,mix.xChallenge);

        // 最大POWERで届く距離には余裕を残す。
        const safeReach=maxHorizontalReachForRise(gap)*0.88;
        xDist=Math.min(xDist,safeReach);

        const leftCenter=previousCenter-xDist;
        const rightCenter=previousCenter+xDist;
        const canLeft=leftCenter>=minCenter;
        const canRight=rightCenter<=maxCenter;

        if(canLeft&&canRight){
            center=Math.random()<0.5?leftCenter:rightCenter;
        }else if(canLeft){
            center=leftCenter;
        }else if(canRight){
            center=rightCenter;
        }else{
            // 画面端で希望距離を確保できない場合は、
            // より距離を取れる側へ寄せる。
            const leftRoom=previousCenter-minCenter;
            const rightRoom=maxCenter-previousCenter;
            center=leftRoom>rightRoom?minCenter:maxCenter;
        }
    }

    center=clamp(center,minCenter,maxCenter);
    const x=center-width/2;

    platforms.push({
        id:nextStep,
        step:nextStep,
        x,
        y:nextPlatformY,
        w:width,
        h:CONFIG.PLATFORM_H
    });
}

function ensurePlatforms(){
    while(nextPlatformY>cameraY-720) addPlatform();
}

function prunePlatforms(){
    // 救済対象は「まだ画面内に見えている足場」だけ。
    // 画面下へ完全に消えた足場は毎フレーム削除する。
    platforms=platforms.filter(p=>{
        const screenY=p.y-cameraY;
        return screenY<H;
    });
}

function resetGame(){
    if(!spriteReady) return;
    gameState="playing";
    lastTime=performance.now();
    elapsed=0;
    playTime=0;
    cameraY=0;
    platforms=[];
    nextPlatformY=0;
    nextStep=0;
    highestStep=0;
    bestBeforeRun=best;
    continueUsed=false;
    checkpoint=null;
    aimPhase=0;
    charging=false;
    charge=0;
    lockedAim=0;
    directionLocked=false;

    const baseY=560;
    const base={id:0,step:0,x:65,y:baseY,w:230,h:CONFIG.PLATFORM_H};
    platforms.push(base);

    player.x=W/2-player.w/2;
    player.y=baseY-player.h;
    player.vx=0;
    player.vy=0;
    player.grounded=true;
    player.currentPlatformId=base.id;
    player.currentStep=0;
    player.facing=1;

    checkpoint={
        platform:{...base},
        cameraY:0
    };

    nextPlatformY=baseY;
    nextStep=0;
    for(let i=0;i<10;i++) addPlatform();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    requestAnimationFrame(loop);
}

function aimValue(){
    return Math.sin(aimPhase*Math.PI*2);
}

function press(){
    if(gameState!=="playing"||!player.grounded||charging) return;
    lockedAim=aimValue();
    directionLocked=true;

    if(Math.abs(lockedAim)>0.03){
        player.facing=lockedAim>0?1:-1;
    }

    charging=true;
    charge=0;
}

function release(){
    if(gameState!=="playing"||!charging) return;

    charging=false;
    const power=Math.max(0.12,charge);

    player.vx=lockedAim*CONFIG.MAX_VX;
    player.vy=-lerp(CONFIG.MIN_JUMP_VY,CONFIG.MAX_JUMP_VY,power);
    player.grounded=false;
    player.currentPlatformId=null;
}

function update(dt){
    elapsed+=dt;
    if(!continueUsed) playTime+=dt;

    if(player.grounded){
        if(!charging){
            aimPhase+=CONFIG.AIM_SPEED*dt;

            // AIM中はゲージ方向に合わせて向きを変える。
            // 中央付近では前の向きを維持してチラつきを防ぐ。
            const liveAim=aimValue();
            if(liveAim>0.12){
                player.facing=1;
            }else if(liveAim<-0.12){
                player.facing=-1;
            }
        }

        if(charging){
            charge=Math.min(1,charge+dt/CONFIG.CHARGE_TIME);
        }

        const platform=platforms.find(p=>p.id===player.currentPlatformId);
        if(platform) player.y=platform.y-player.h;
    } else {
        const previousBottom=player.y+player.h;

        player.vy=Math.min(CONFIG.MAX_FALL_SPEED,player.vy+CONFIG.GRAVITY*dt);
        player.x+=player.vx*dt;
        player.y+=player.vy*dt;

        if(player.x<0){
            player.x=0;
            player.vx=Math.abs(player.vx)*CONFIG.WALL_BOUNCE;
            player.facing=1;
        } else if(player.x+player.w>W){
            player.x=W-player.w;
            player.vx=-Math.abs(player.vx)*CONFIG.WALL_BOUNCE;
            player.facing=-1;
        }

        if(player.vy>0){
            const newBottom=player.y+player.h;

            const candidates=platforms
                .filter(p=>p.y>=previousBottom-CONFIG.LAND_TOLERANCE &&
                           p.y<=newBottom+CONFIG.LAND_TOLERANCE)
                .sort((a,b)=>a.y-b.y);

            for(const p of candidates){
                const overlapX=
                    player.x+player.w-CONFIG.LAND_MARGIN_X>p.x &&
                    player.x+CONFIG.LAND_MARGIN_X<p.x+p.w;

                const crossedY=
                    previousBottom<=p.y+CONFIG.LAND_TOLERANCE &&
                    newBottom>=p.y;

                if(overlapX&&crossedY){
                    player.y=p.y-player.h;
                    player.vx=0;
                    player.vy=0;
                    player.grounded=true;
                    player.currentPlatformId=p.id;
                    player.currentStep=p.step;

                    directionLocked=false;
                    charging=false;
                    charge=0;

                    highestStep=Math.max(highestStep,p.step);

                    prunePlatforms();
                    break;
                }
            }
        }
    }

    const playerScreenY=player.y-cameraY;
    const cameraLine=H*CONFIG.CAMERA_LINE;

    if(playerScreenY<cameraLine){
        cameraY=player.y-cameraLine;
    }

    ensurePlatforms();
    prunePlatforms();

    if(player.grounded&&player.currentPlatformId!==null){
        const platform=platforms.find(p=>p.id===player.currentPlatformId);
        if(platform){
            checkpoint={
                platform:{...platform},
                cameraY
            };
        }
    }

    if(player.y-cameraY>H+60){
        endGame();
    }
}

function getPlayerFrame(){
    if(!player.grounded) return FRAME_JUMP;
    if(!directionLocked) return FRAME_IDLE;

    const frame=Math.floor(elapsed*CONFIG.STEP_FPS)%2;
    return frame===0?FRAME_IDLE:FRAME_STEP;
}

function drawPlayer(){
    if(!spriteReady) return;

    const frame=getPlayerFrame();
    const sourceX=frame*FRAME_W;
    const screenX=Math.round(player.x);
    const screenY=Math.round(player.y-cameraY);

    ctx.save();
    ctx.imageSmoothingEnabled=false;

    if(player.facing===1){
        ctx.translate(screenX+player.w,screenY);
        ctx.scale(-1,1);
        ctx.drawImage(
            activeSprite,
            sourceX,0,FRAME_W,FRAME_H,
            0,0,player.w,player.h
        );
    } else {
        ctx.translate(screenX,screenY);
        ctx.drawImage(
            activeSprite,
            sourceX,0,FRAME_W,FRAME_H,
            0,0,player.w,player.h
        );
    }

    ctx.restore();
}

function drawPlatform(p){
    const sy=Math.floor(p.y-cameraY);
    if(sy<-20||sy>H+20) return;

    ctx.fillStyle="#fff";
    ctx.fillRect(Math.floor(p.x),sy,Math.floor(p.w),p.h);
}

function drawMeter(){
    if(!player.grounded) return;

    const playerCenter=player.x+player.w/2;
    const playerScreenY=player.y-cameraY;
    const half=CONFIG.METER_W/2;

    const centerX=clamp(
        playerCenter,
        CONFIG.METER_MARGIN+half,
        W-CONFIG.METER_MARGIN-half
    );

    const meterY=Math.max(42,playerScreenY-32);

    const plateHeight=charging?35:20;

    ctx.fillStyle="#000";
    ctx.fillRect(
        Math.floor(centerX-half-5),
        Math.floor(meterY-6),
        CONFIG.METER_W+10,
        plateHeight
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.strokeRect(
        Math.floor(centerX-half),
        Math.floor(meterY),
        CONFIG.METER_W,
        CONFIG.METER_H
    );

    // 真上ジャンプ（水平速度0）の基準。
    // 方向バーには中央だけ1pxの目印を置く。
    ctx.fillStyle="#fff";
    ctx.fillRect(
        Math.floor(centerX),
        Math.floor(meterY+2),
        1,
        Math.max(1,CONFIG.METER_H-4)
    );

    const aim=charging?lockedAim:aimValue();

    const dotX=
        centerX-half+
        (aim*0.5+0.5)*CONFIG.METER_W;

    ctx.fillStyle="#fff";
    ctx.fillRect(
        Math.floor(dotX-2),
        Math.floor(meterY-3),
        4,
        13
    );

    if(charging){
        const powerY=meterY+CONFIG.POWER_GAP;

        ctx.strokeRect(
            Math.floor(centerX-half),
            Math.floor(powerY),
            CONFIG.METER_W,
            CONFIG.METER_H
        );

        ctx.fillRect(
            Math.floor(centerX-half),
            Math.floor(powerY),
            Math.floor(CONFIG.METER_W*charge),
            CONFIG.METER_H
        );
    }
}

function draw(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(255,255,255,0.035)";
    for(let y=40;y<H;y+=40){
        ctx.fillRect(0,y,W,1);
    }

    for(const p of platforms) drawPlatform(p);

    drawPlayer();
    drawMeter();

    ctx.font="bold 15px Courier New";
    ctx.textAlign="left";
    ctx.lineJoin="miter";
    ctx.miterLimit=2;

    const heightText="HEIGHT "+String(highestStep).padStart(3,"0");
    const timeText="TIME "+playTime.toFixed(2);

    // 黒縁を先に描いて、白い足場と重なっても読めるようにする。
    // 背景板は使わないので足場自体は隠れない。
    ctx.lineWidth=4;
    ctx.strokeStyle="#000";
    ctx.strokeText(heightText,12,23);
    ctx.strokeText(timeText,12,43);

    ctx.fillStyle="#fff";
    ctx.fillText(heightText,12,23);
    ctx.fillText(timeText,12,43);

    if(continueUsed){
        ctx.textAlign="right";
        ctx.strokeText("PRACTICE",W-12,23);
        ctx.fillText("PRACTICE",W-12,23);
        ctx.textAlign="left";
    }


}

function loop(now){
    if(gameState!=="playing") return;

    const dt=Math.min(
        0.033,
        Math.max(0,(now-lastTime)/1000)
    );

    lastTime=now;

    update(dt);
    draw();

    if(gameState==="playing"){
        requestAnimationFrame(loop);
    }
}

function continueGame(){
    if(gameState!=="gameover"||!checkpoint) return;

    // CONTINUEを選んだ時点で、このラン全体をテスト扱いにする。
    // 直前のGAME OVERで一時的にBESTを更新していても開始前の値へ戻す。
    continueUsed=true;
    if(best!==bestBeforeRun){
        best=bestBeforeRun;
        saveBest(best);
    }

    const saved=checkpoint.platform;
    let platform=platforms.find(p=>p.id===saved.id);
    if(!platform){
        platform={...saved};
        platforms.push(platform);
    }

    player.x=clamp(
        platform.x+platform.w/2-player.w/2,
        0,
        W-player.w
    );
    player.y=platform.y-player.h;
    player.vx=0;
    player.vy=0;
    player.grounded=true;
    player.currentPlatformId=platform.id;
    player.currentStep=platform.step;

    cameraY=checkpoint.cameraY;
    aimPhase=0;
    charging=false;
    charge=0;
    lockedAim=0;
    directionLocked=false;

    gameState="playing";
    lastTime=performance.now();
    gameOverScreen.classList.add("hidden");
    requestAnimationFrame(loop);
}

function endGame(){
    if(gameState!=="playing") return;

    gameState="gameover";
    charging=false;

    if(!continueUsed&&highestStep>best){
        best=highestStep;
        saveBest(best);
    }

    finalScore.textContent="HEIGHT: "+String(highestStep).padStart(3,"0")+(continueUsed?" (PRACTICE)":"");
    finalTime.textContent=continueUsed
        ?"TIME: --"
        :"TIME: "+playTime.toFixed(2);
    bestScore.textContent="BEST: "+String(best).padStart(3,"0");

    continueButton.disabled=!checkpoint;
    gameOverScreen.classList.remove("hidden");
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    press();
});

canvas.addEventListener("pointerup",e=>{
    e.preventDefault();
    release();
});

canvas.addEventListener("pointercancel",e=>{
    e.preventDefault();
    release();
});

window.addEventListener("keydown",e=>{
    if(e.code==="Space"&&!e.repeat){
        e.preventDefault();
        press();
    }else if(e.code==="KeyC"&&!e.repeat&&gameState==="gameover"){
        e.preventDefault();
        continueGame();
    }
});

window.addEventListener("keyup",e=>{
    if(e.code==="Space"){
        e.preventDefault();
        release();
    }
});

// タブ切替・画面ロックなどから復帰した直後に巨大なdtを入れない。
document.addEventListener("visibilitychange",()=>{
    if(gameState==="playing"){
        lastTime=performance.now();
    }
});

window.addEventListener("pageshow",()=>{
    if(gameState==="playing"){
        lastTime=performance.now();
    }
});

// 長押し時のコンテキストメニュー等に操作を奪われないようにする。
canvas.addEventListener("contextmenu",e=>e.preventDefault());

startButton.addEventListener("click",resetGame);
continueButton.addEventListener("click",continueGame);
retryButton.addEventListener("click",resetGame);

ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

})();
</script>
</body>
</html>
