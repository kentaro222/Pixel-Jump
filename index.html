<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PIXEL JUMP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Courier New",monospace}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center}
#game-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;border:2px solid #fff;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.88);text-align:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.hidden{display:none}
h1{margin:0 0 12px;font-size:38px}
p{margin:5px 0;color:#bbb;font-size:13px}
button{margin-top:20px;padding:14px 30px;border:0;background:#fff;color:#000;font:700 18px "Courier New",monospace}
button:disabled{background:#555;color:#aaa}
</style>
</head>
<body>
<div id="game-wrap">
<canvas id="game"></canvas>

<div id="start-screen" class="overlay">
<h1>PIXEL JUMP</h1>
<p>PRESS = DIRECTION</p>
<p>HOLD = POWER</p>
<p>RELEASE = JUMP</p>
<button id="start-button" disabled>LOADING...</button>
</div>

<div id="game-over-screen" class="overlay hidden">
<h1>GAME OVER</h1>
<p id="final-score">HEIGHT: 000</p>
<p id="final-time">TIME: 0.00</p>
<p id="best-score">BEST: 000</p>
<p id="continue-note">CONTINUE = PRACTICE / RECORDS DISABLED</p>
<button id="continue-button">CONTINUE</button>
<button id="retry-button">RETRY</button>
</div>
</div>

<script>
(() => {
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const startScreen=document.getElementById("start-screen");
const gameOverScreen=document.getElementById("game-over-screen");
const startButton=document.getElementById("start-button");
const continueButton=document.getElementById("continue-button");
const retryButton=document.getElementById("retry-button");
const finalScore=document.getElementById("final-score");
const finalTime=document.getElementById("final-time");
const bestScore=document.getElementById("best-score");

const W=360,H=640;
canvas.width=W; canvas.height=H;
ctx.imageSmoothingEnabled=false;

const spriteSheet=new Image();
let spriteReady=false;
let activeSprite=spriteSheet;
let usingFallbackSprite=false;

const FRAME_W=16,FRAME_H=16;
const FRAME_IDLE=0,FRAME_STEP=1,FRAME_JUMP=2;

function createFallbackSpriteSheet(){
    // 外部PNGが読めない場合でもゲームを遊べるよう、
    // 48x16 / 3フレームの簡易1bitキャラを自動生成する。
    const c=document.createElement("canvas");
    c.width=48;
    c.height=16;
    const g=c.getContext("2d");
    g.imageSmoothingEnabled=false;
    g.fillStyle="#fff";

    function px(frame,x,y,w=1,h=1){
        g.fillRect(frame*16+x,y,w,h);
    }

    // IDLE
    px(0,6,2,4,3);     // head
    px(0,5,5,6,5);     // body
    px(0,4,6,1,4);     // left arm
    px(0,11,6,1,4);    // right arm
    px(0,6,10,2,4);    // left leg
    px(0,8,10,2,4);    // right leg
    px(0,5,14,3,1);    // left foot
    px(0,8,14,3,1);    // right foot

    // STEP
    px(1,6,2,4,3);
    px(1,5,5,6,5);
    px(1,4,6,1,4);
    px(1,11,6,1,4);
    px(1,5,10,2,3);
    px(1,9,10,2,3);
    px(1,3,13,4,1);
    px(1,9,13,4,1);

    // JUMP
    px(2,6,3,4,3);
    px(2,5,6,6,5);
    px(2,3,3,2,5);     // left arm up
    px(2,11,3,2,5);    // right arm up
    px(2,4,11,3,2);    // left leg out
    px(2,9,11,3,2);    // right leg out
    px(2,3,13,3,1);
    px(2,10,13,3,1);

    return c;
}

function useFallbackSprite(reason){
    activeSprite=createFallbackSpriteSheet();
    usingFallbackSprite=true;
    spriteReady=true;
    startButton.disabled=false;
    startButton.textContent="START";
    console.warn("Using built-in fallback sprite:",reason);
}

spriteSheet.onload=()=>{
    if(spriteSheet.naturalWidth!==48 || spriteSheet.naturalHeight!==16){
        console.error(
            "player_1bit00_sheet.png must be 48x16.",
            spriteSheet.naturalWidth,
            spriteSheet.naturalHeight
        );
        useFallbackSprite("sprite size mismatch");
        return;
    }

    activeSprite=spriteSheet;
    usingFallbackSprite=false;
    spriteReady=true;
    startButton.disabled=false;
    startButton.textContent="START";
};

spriteSheet.onerror=()=>{
    console.error("Could not load ./player_1bit00_sheet.png");
    useFallbackSprite("sprite load error");
};

spriteSheet.src="./player_1bit00_sheet.png";

const CONFIG={
    PLAYER_SIZE:48,
    GRAVITY:980,
    MAX_FALL_SPEED:820,
    MIN_JUMP_VY:410,
    MAX_JUMP_VY:720,
    MAX_VX:250,
    AIM_SPEED:0.72,
    CHARGE_TIME:0.85,
    STEP_FPS:5,
    METER_W:72,
    METER_H:7,
    METER_MARGIN:8,
    POWER_GAP:14,
    PLATFORM_H:8,
    LAND_MARGIN_X:21,
    LAND_TOLERANCE:5,
    CAMERA_LINE:0.44,
    WALL_BOUNCE:1.0
};

function resize(){
    const scale=Math.min(innerWidth/W,innerHeight/H);
    canvas.style.width=Math.floor(W*scale)+"px";
    canvas.style.height=Math.floor(H*scale)+"px";
    ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize);
resize();

let gameState="title";
let lastTime=0,elapsed=0;
let playTime=0;
let cameraY=0;
let platforms=[];
let nextPlatformY=0,nextStep=0;
let highestStep=0;

function loadBest(){
    try{
        const value=Number(localStorage.getItem("pixelJumpBest")||0);
        return Number.isFinite(value)?value:0;
    }catch(err){
        console.warn("High score storage is unavailable.",err);
        return 0;
    }
}

function saveBest(value){
    try{
        localStorage.setItem("pixelJumpBest",String(value));
    }catch(err){
        console.warn("Could not save high score.",err);
    }
}

let best=loadBest();
let bestBeforeRun=best;
let continueUsed=false;
let checkpoint=null;

let aimPhase=0;
let charging=false;
let charge=0;
let lockedAim=0;
let directionLocked=false;

const player={
    x:0,y:0,vx:0,vy:0,
    w:CONFIG.PLAYER_SIZE,
    h:CONFIG.PLAYER_SIZE,
    grounded:true,
    currentPlatformId:0,
    currentStep:0,
    facing:1
};

const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// 難易度は「出発足場のstep」で判定。旧50～70段の別処理は統合。
// step 0も導入区間として扱う。段階境界・上限をここで調整できる。
const DIFFICULTY={
    EASY_END:5, GUARANTEED_END:12, MIXED_END:20, CAP_STEP:100,
    EASY_WIDTH:[152,172], MID_WIDTH:[112,132],
    LATE_WIDTH:[94,120], CAP_WIDTH:[52,90],
    EARLY_GAP:110, MIX_LOW:114, MIX_HIGH:166,
    LATE_GAP:144, GAP_JITTER:2, NO_SKIP_MARGIN:10,
    SINGLE_POWER:0.72, SKIP_POWER:0.98, // 一段登りは72%で届き、二段先には届かない。
    LAND_CLEARANCE:8, CANDIDATES:48
};
let generationTail=[]; // 削除される描画用配列と分離し、直近2枚を保持。
let mixedGapPlan=[];
let lastChallenge=0.5;

function phase(step){
    if(step<=DIFFICULTY.EASY_END) return 1;
    if(step<=DIFFICULTY.GUARANTEED_END) return 2;
    if(step<=DIFFICULTY.MIXED_END) return 3;
    return 4;
}

function prepareDifficulty(){
    // 混在区間の前半に低い段を集め、後半に短い低段の窓を1回置く。
    // 8出発段の初期値では前半3/4、後半1/4がskip可能。
    // 高段の前後も含めて2段分を先読み。窓の位置はランごとに変える。
    const start=DIFFICULTY.GUARANTEED_END+1;
    const count=DIFFICULTY.MIXED_END-start+1;
    const lateWindow=Math.random()<0.5?0.625:0.75;
    const highEdge=start+Math.floor(count*0.375)+2;
    const windowEdge=start+Math.floor(count*lateWindow)+1;
    mixedGapPlan=[];
    for(let n=start;n<=DIFFICULTY.MIXED_END+3;n++){
        let gap=DIFFICULTY.MIX_LOW;
        if(n>=highEdge) gap=DIFFICULTY.MIX_HIGH;
        if(n===windowEdge||n===windowEdge+1) gap=DIFFICULTY.MIX_LOW;
        if(n>=windowEdge+3) gap=DIFFICULTY.LATE_GAP;
        mixedGapPlan[n]=gap+rand(-DIFFICULTY.GAP_JITTER,DIFFICULTY.GAP_JITTER);
    }
    lastChallenge=0.5;
}

function gapAt(n){
    if(mixedGapPlan[n]!==undefined) return mixedGapPlan[n];
    return (n<=DIFFICULTY.GUARANTEED_END?DIFFICULTY.EARLY_GAP:DIFFICULTY.LATE_GAP)
        +rand(-DIFFICULTY.GAP_JITTER,DIFFICULTY.GAP_JITTER);
}

function platformSettings(origin){
    let widths, distance;
    if(phase(origin)===1){
        widths=DIFFICULTY.EASY_WIDTH; distance=[24,64];
    }else if(phase(origin)===2){
        const t=(origin-DIFFICULTY.EASY_END)/(DIFFICULTY.GUARANTEED_END-DIFFICULTY.EASY_END);
        widths=DIFFICULTY.EASY_WIDTH.map((v,i)=>lerp(v,DIFFICULTY.MID_WIDTH[i],t));
        distance=[24,64]; // 幅を締める区間では距離を同時に難化しない。
    }else if(phase(origin)===3){
        const t=(origin-DIFFICULTY.GUARANTEED_END)/(DIFFICULTY.MIXED_END-DIFFICULTY.GUARANTEED_END);
        widths=DIFFICULTY.MID_WIDTH.map((v,i)=>lerp(v,DIFFICULTY.LATE_WIDTH[i],t));
        distance=[lerp(24,40,t),lerp(64,110,t)];
    }else{
        const t=clamp((origin-DIFFICULTY.MIXED_END)/(DIFFICULTY.CAP_STEP-DIFFICULTY.MIXED_END),0,1);
        widths=DIFFICULTY.LATE_WIDTH.map((v,i)=>lerp(v,DIFFICULTY.CAP_WIDTH[i],t));
        distance=[lerp(40,65,t),lerp(110,190,t)];
    }
    return {widths,distance};
}

// updateと同じ半陰的Euler法・落下速度上限・下降時の着地判定。
// fps変動を含む複数の時間刻みで、共通して安全に着地する速度区間を求める。
const VALIDATION_DT=[[1/120],[1/60],[1/30],[0.033],[1/120,0.033,1/60]];
function landingTimes(rise,power){
    const times=[];
    for(const profile of VALIDATION_DT){
        let bottom=0,vy=-lerp(CONFIG.MIN_JUMP_VY,CONFIG.MAX_JUMP_VY,power),time=0;
        let landed=false;
        for(let i=0;i<500;i++){
            const dt=profile[i%profile.length],previous=bottom;
            vy=Math.min(CONFIG.MAX_FALL_SPEED,vy+CONFIG.GRAVITY*dt);
            bottom+=vy*dt; time+=dt;
            if(vy>0&&previous<=-rise+CONFIG.LAND_TOLERANCE&&bottom>=-rise){
                times.push(time); landed=true; break;
            }
            if(vy>0&&bottom>0) break;
        }
        if(!landed) return null;
    }
    // 任意の0<dt<=0.033にも対応。半陰的Eulerの追加落下量は
    // g/2*Σdt² <= g/2*0.033*t。下降時の通過時刻を両包絡線で挟む。
    // 最後のフレームが通過時刻を跨ぐ分も加え、同じ速度で着地可能にする。
    const v=lerp(CONFIG.MIN_JUMP_VY,CONFIG.MAX_JUMP_VY,power);
    const fastV=v-CONFIG.GRAVITY*0.033/2;
    const fastDisc=fastV*fastV-2*CONFIG.GRAVITY*rise;
    if(fastDisc<0) return null;
    times.push((fastV+Math.sqrt(fastDisc))/CONFIG.GRAVITY,
        (v+Math.sqrt(v*v-2*CONFIG.GRAVITY*rise))/CONFIG.GRAVITY+0.033);
    return times;
}

function launchRange(p){
    return [Math.max(player.w/2,p.x+CONFIG.LAND_MARGIN_X-player.w/2),
        Math.min(W-player.w/2,p.x+p.w-CONFIG.LAND_MARGIN_X+player.w/2)];
}
function routeVelocity(from,to,center,power,times=landingTimes(from.y-to.y,power)){
    if(!times) return null;
    // 内側に8px以上着地。壁反射なし、方向ゲージの速度上限にも余裕。
    const half=player.w/2;
    const left=Math.max(half,to.x+DIFFICULTY.LAND_CLEARANCE);
    const right=Math.min(W-half,to.x+to.w-DIFFICULTY.LAND_CLEARANCE);
    let low=-CONFIG.MAX_VX*0.9,high=CONFIG.MAX_VX*0.9;
    for(const t of times){
        low=Math.max(low,(left-center)/t);
        high=Math.min(high,(right-center)/t);
    }
    return low<=high?(low+high)/2:null;
}
function routeGuaranteed(from,to,power){
    const times=landingTimes(from.y-to.y,power);
    return !!times&&launchRange(from).every(x=>routeVelocity(from,to,x,power,times)!==null);
    // 速度区間は出発xの一次式。両端が成立すれば、その間の全位置で成立。
}

function addPlatform(){
    const previous=generationTail[generationTail.length-1];
    const twoBack=generationTail[generationTail.length-2];
    const n=previous.step+1, settings=platformSettings(previous.step);
    let gap=gapAt(n);
    const maxRise=CONFIG.MAX_JUMP_VY**2/(2*CONFIG.GRAVITY);
    // 境界またぎも出発stepで禁止。直前のgapを含む合計に余裕を加える。
    if(twoBack&&phase(twoBack.step)===4){
        gap=Math.max(gap,maxRise+DIFFICULTY.NO_SKIP_MARGIN-(twoBack.y-previous.y));
    }
    const y=previous.y-gap;
    const mustSkip=twoBack&&(phase(twoBack.step)<=2 ||
        (phase(twoBack.step)===3&&twoBack.y-y<maxRise));
    let result=null;
    for(let attempt=0;attempt<=DIFFICULTY.CANDIDATES;attempt++){
        // 細い→近い、遠い→広い、中間も混ぜる。厳しい種類の連続を抑える。
        const challenge=clamp(rand(0.08,0.92),lastChallenge-0.45,lastChallenge+0.45);
        const width=lerp(settings.widths[1],settings.widths[0],challenge);
        const distance=lerp(settings.distance[1],settings.distance[0],challenge);
        const pc=previous.x+previous.w/2;
        const sign=Math.random()<0.5?-1:1;
        // 折り返せる側を選ぶ。clampで距離だけが潰れる配置を避ける。
        const min=14+width/2,max=W-14-width/2;
        let center=pc+sign*distance;
        if(center<min||center>max) center=pc-sign*distance;
        center=clamp(center,min,max);
        if(attempt===DIFFICULTY.CANDIDATES) center=clamp(pc,min,max);
        const p={id:n,step:n,x:center-width/2,y,w:width,h:CONFIG.PLATFORM_H};
        if(!routeGuaranteed(previous,p,DIFFICULTY.SINGLE_POWER)) continue;
        if(mustSkip&&!routeGuaranteed(twoBack,p,DIFFICULTY.SKIP_POWER)) continue;
        result=p; lastChallenge=challenge; break;
    }
    // 検証を通らない候補は公開しない。設定変更時も到達不能を黙って生成しない。
    if(!result) throw new Error("Unreachable platform settings at step "+n);
    platforms.push(result);
    generationTail.push(result);
    generationTail=generationTail.slice(-2);
    nextStep=n; nextPlatformY=y;
}

function ensurePlatforms(){
    while(nextPlatformY>cameraY-720) addPlatform();
}

function prunePlatforms(){
    // 救済対象は「まだ画面内に見えている足場」だけ。
    // 画面下へ完全に消えた足場は毎フレーム削除する。
    platforms=platforms.filter(p=>{
        const screenY=p.y-cameraY;
        return screenY<H;
    });
}

function resetGame(){
    if(!spriteReady) return;
    gameState="playing";
    lastTime=performance.now();
    elapsed=0;
    playTime=0;
    cameraY=0;
    platforms=[];
    nextPlatformY=0;
    nextStep=0;
    highestStep=0;
    bestBeforeRun=best;
    continueUsed=false;
    checkpoint=null;
    aimPhase=0;
    charging=false;
    charge=0;
    lockedAim=0;
    directionLocked=false;

    const baseY=560;
    const base={id:0,step:0,x:65,y:baseY,w:230,h:CONFIG.PLATFORM_H};
    platforms.push(base);

    player.x=W/2-player.w/2;
    player.y=baseY-player.h;
    player.vx=0;
    player.vy=0;
    player.grounded=true;
    player.currentPlatformId=base.id;
    player.currentStep=0;
    player.facing=1;

    checkpoint={
        platform:{...base},
        cameraY:0
    };

    generationTail=[base];
    prepareDifficulty();
    nextPlatformY=baseY;
    nextStep=0;
    for(let i=0;i<10;i++) addPlatform();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    requestAnimationFrame(loop);
}

function aimValue(){
    return Math.sin(aimPhase*Math.PI*2);
}

function press(){
    if(gameState!=="playing"||!player.grounded||charging) return;
    lockedAim=aimValue();
    directionLocked=true;

    if(Math.abs(lockedAim)>0.03){
        player.facing=lockedAim>0?1:-1;
    }

    charging=true;
    charge=0;
}

function release(){
    if(gameState!=="playing"||!charging) return;

    charging=false;
    const power=Math.max(0.12,charge);

    player.vx=lockedAim*CONFIG.MAX_VX;
    player.vy=-lerp(CONFIG.MIN_JUMP_VY,CONFIG.MAX_JUMP_VY,power);
    player.grounded=false;
    player.currentPlatformId=null;
}

function update(dt){
    elapsed+=dt;
    if(!continueUsed) playTime+=dt;

    if(player.grounded){
        if(!charging){
            aimPhase+=CONFIG.AIM_SPEED*dt;

            // AIM中はゲージ方向に合わせて向きを変える。
            // 中央付近では前の向きを維持してチラつきを防ぐ。
            const liveAim=aimValue();
            if(liveAim>0.12){
                player.facing=1;
            }else if(liveAim<-0.12){
                player.facing=-1;
            }
        }

        if(charging){
            charge=Math.min(1,charge+dt/CONFIG.CHARGE_TIME);
        }

        const platform=platforms.find(p=>p.id===player.currentPlatformId);
        if(platform) player.y=platform.y-player.h;
    } else {
        const previousBottom=player.y+player.h;

        player.vy=Math.min(CONFIG.MAX_FALL_SPEED,player.vy+CONFIG.GRAVITY*dt);
        player.x+=player.vx*dt;
        player.y+=player.vy*dt;

        if(player.x<0){
            player.x=0;
            player.vx=Math.abs(player.vx)*CONFIG.WALL_BOUNCE;
            player.facing=1;
        } else if(player.x+player.w>W){
            player.x=W-player.w;
            player.vx=-Math.abs(player.vx)*CONFIG.WALL_BOUNCE;
            player.facing=-1;
        }

        if(player.vy>0){
            const newBottom=player.y+player.h;

            const candidates=platforms
                .filter(p=>p.y>=previousBottom-CONFIG.LAND_TOLERANCE &&
                           p.y<=newBottom+CONFIG.LAND_TOLERANCE)
                .sort((a,b)=>a.y-b.y);

            for(const p of candidates){
                const overlapX=
                    player.x+player.w-CONFIG.LAND_MARGIN_X>p.x &&
                    player.x+CONFIG.LAND_MARGIN_X<p.x+p.w;

                const crossedY=
                    previousBottom<=p.y+CONFIG.LAND_TOLERANCE &&
                    newBottom>=p.y;

                if(overlapX&&crossedY){
                    player.y=p.y-player.h;
                    player.vx=0;
                    player.vy=0;
                    player.grounded=true;
                    player.currentPlatformId=p.id;
                    player.currentStep=p.step;

                    directionLocked=false;
                    charging=false;
                    charge=0;

                    highestStep=Math.max(highestStep,p.step);

                    prunePlatforms();
                    break;
                }
            }
        }
    }

    const playerScreenY=player.y-cameraY;
    const cameraLine=H*CONFIG.CAMERA_LINE;

    if(playerScreenY<cameraLine){
        cameraY=player.y-cameraLine;
    }

    ensurePlatforms();
    prunePlatforms();

    if(player.grounded&&player.currentPlatformId!==null){
        const platform=platforms.find(p=>p.id===player.currentPlatformId);
        if(platform){
            checkpoint={
                platform:{...platform},
                cameraY
            };
        }
    }

    if(player.y-cameraY>H+60){
        endGame();
    }
}

function getPlayerFrame(){
    if(!player.grounded) return FRAME_JUMP;
    if(!directionLocked) return FRAME_IDLE;

    const frame=Math.floor(elapsed*CONFIG.STEP_FPS)%2;
    return frame===0?FRAME_IDLE:FRAME_STEP;
}

function drawPlayer(){
    if(!spriteReady) return;

    const frame=getPlayerFrame();
    const sourceX=frame*FRAME_W;
    const screenX=Math.round(player.x);
    const screenY=Math.round(player.y-cameraY);

    ctx.save();
    ctx.imageSmoothingEnabled=false;

    if(player.facing===1){
        ctx.translate(screenX+player.w,screenY);
        ctx.scale(-1,1);
        ctx.drawImage(
            activeSprite,
            sourceX,0,FRAME_W,FRAME_H,
            0,0,player.w,player.h
        );
    } else {
        ctx.translate(screenX,screenY);
        ctx.drawImage(
            activeSprite,
            sourceX,0,FRAME_W,FRAME_H,
            0,0,player.w,player.h
        );
    }

    ctx.restore();
}

function drawPlatform(p){
    const sy=Math.floor(p.y-cameraY);
    if(sy<-20||sy>H+20) return;

    ctx.fillStyle="#fff";
    ctx.fillRect(Math.floor(p.x),sy,Math.floor(p.w),p.h);
}

function drawMeter(){
    if(!player.grounded) return;

    const playerCenter=player.x+player.w/2;
    const playerScreenY=player.y-cameraY;
    const half=CONFIG.METER_W/2;

    const centerX=clamp(
        playerCenter,
        CONFIG.METER_MARGIN+half,
        W-CONFIG.METER_MARGIN-half
    );

    const meterY=Math.max(42,playerScreenY-32);

    const plateHeight=charging?35:20;

    ctx.fillStyle="#000";
    ctx.fillRect(
        Math.floor(centerX-half-5),
        Math.floor(meterY-6),
        CONFIG.METER_W+10,
        plateHeight
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.strokeRect(
        Math.floor(centerX-half),
        Math.floor(meterY),
        CONFIG.METER_W,
        CONFIG.METER_H
    );

    // 真上ジャンプ（水平速度0）の基準。
    // 方向バーには中央だけ1pxの目印を置く。
    ctx.fillStyle="#fff";
    ctx.fillRect(
        Math.floor(centerX),
        Math.floor(meterY+2),
        1,
        Math.max(1,CONFIG.METER_H-4)
    );

    const aim=charging?lockedAim:aimValue();

    const dotX=
        centerX-half+
        (aim*0.5+0.5)*CONFIG.METER_W;

    ctx.fillStyle="#fff";
    ctx.fillRect(
        Math.floor(dotX-2),
        Math.floor(meterY-3),
        4,
        13
    );

    if(charging){
        const powerY=meterY+CONFIG.POWER_GAP;

        ctx.strokeRect(
            Math.floor(centerX-half),
            Math.floor(powerY),
            CONFIG.METER_W,
            CONFIG.METER_H
        );

        ctx.fillRect(
            Math.floor(centerX-half),
            Math.floor(powerY),
            Math.floor(CONFIG.METER_W*charge),
            CONFIG.METER_H
        );
    }
}

function draw(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(255,255,255,0.035)";
    for(let y=40;y<H;y+=40){
        ctx.fillRect(0,y,W,1);
    }

    for(const p of platforms) drawPlatform(p);

    drawPlayer();
    drawMeter();

    ctx.font="bold 15px Courier New";
    ctx.textAlign="left";
    ctx.lineJoin="miter";
    ctx.miterLimit=2;

    const heightText="HEIGHT "+String(highestStep).padStart(3,"0");
    const timeText="TIME "+playTime.toFixed(2);

    // 黒縁を先に描いて、白い足場と重なっても読めるようにする。
    // 背景板は使わないので足場自体は隠れない。
    ctx.lineWidth=4;
    ctx.strokeStyle="#000";
    ctx.strokeText(heightText,12,23);
    ctx.strokeText(timeText,12,43);

    ctx.fillStyle="#fff";
    ctx.fillText(heightText,12,23);
    ctx.fillText(timeText,12,43);

    if(continueUsed){
        ctx.textAlign="right";
        ctx.strokeText("PRACTICE",W-12,23);
        ctx.fillText("PRACTICE",W-12,23);
        ctx.textAlign="left";
    }


}

function loop(now){
    if(gameState!=="playing") return;

    const dt=Math.min(
        0.033,
        Math.max(0,(now-lastTime)/1000)
    );

    lastTime=now;

    update(dt);
    draw();

    if(gameState==="playing"){
        requestAnimationFrame(loop);
    }
}

function continueGame(){
    if(gameState!=="gameover"||!checkpoint) return;

    // CONTINUEを選んだ時点で、このラン全体をテスト扱いにする。
    // 直前のGAME OVERで一時的にBESTを更新していても開始前の値へ戻す。
    continueUsed=true;
    if(best!==bestBeforeRun){
        best=bestBeforeRun;
        saveBest(best);
    }

    const saved=checkpoint.platform;
    let platform=platforms.find(p=>p.id===saved.id);
    if(!platform){
        platform={...saved};
        platforms.push(platform);
    }

    player.x=clamp(
        platform.x+platform.w/2-player.w/2,
        0,
        W-player.w
    );
    player.y=platform.y-player.h;
    player.vx=0;
    player.vy=0;
    player.grounded=true;
    player.currentPlatformId=platform.id;
    player.currentStep=platform.step;

    cameraY=checkpoint.cameraY;
    aimPhase=0;
    charging=false;
    charge=0;
    lockedAim=0;
    directionLocked=false;

    gameState="playing";
    lastTime=performance.now();
    gameOverScreen.classList.add("hidden");
    requestAnimationFrame(loop);
}

function endGame(){
    if(gameState!=="playing") return;

    gameState="gameover";
    charging=false;

    if(!continueUsed&&highestStep>best){
        best=highestStep;
        saveBest(best);
    }

    finalScore.textContent="HEIGHT: "+String(highestStep).padStart(3,"0")+(continueUsed?" (PRACTICE)":"");
    finalTime.textContent=continueUsed
        ?"TIME: --"
        :"TIME: "+playTime.toFixed(2);
    bestScore.textContent="BEST: "+String(best).padStart(3,"0");

    continueButton.disabled=!checkpoint;
    gameOverScreen.classList.remove("hidden");
}

canvas.addEventListener("pointerdown",e=>{
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    press();
});

canvas.addEventListener("pointerup",e=>{
    e.preventDefault();
    release();
});

canvas.addEventListener("pointercancel",e=>{
    e.preventDefault();
    release();
});

window.addEventListener("keydown",e=>{
    if(e.code==="Space"&&!e.repeat){
        e.preventDefault();
        press();
    }else if(e.code==="KeyC"&&!e.repeat&&gameState==="gameover"){
        e.preventDefault();
        continueGame();
    }
});

window.addEventListener("keyup",e=>{
    if(e.code==="Space"){
        e.preventDefault();
        release();
    }
});

// タブ切替・画面ロックなどから復帰した直後に巨大なdtを入れない。
document.addEventListener("visibilitychange",()=>{
    if(gameState==="playing"){
        lastTime=performance.now();
    }
});

window.addEventListener("pageshow",()=>{
    if(gameState==="playing"){
        lastTime=performance.now();
    }
});

// 長押し時のコンテキストメニュー等に操作を奪われないようにする。
canvas.addEventListener("contextmenu",e=>e.preventDefault());

startButton.addEventListener("click",resetGame);
continueButton.addEventListener("click",continueGame);
retryButton.addEventListener("click",resetGame);

ctx.fillStyle="#000";
ctx.fillRect(0,0,W,H);

})();
</script>
</body>
</html>
